<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Flexbox Demo</h1>
    <p>Cards wrap based on Window Resize; some properties below:</p>
    <ul>
      <li>flex-direction</li>
      <li>align-items</li>
      <li>justify-content</li>
    </ul>
  </header>

  <div class="wrapper-card">
    <div class="card one">
      <h2>Card One</h2>
      <p>This is the first card.</p>
    </div>

    <div class="card two">
      <h2>Card Two</h2>
      <p>This card has more text to show how the content can differ.</p>
    </div>

    <div class="card three">
      <h2>Card Three</h2>
      <p>This is the third card.</p>
    </div>
  </div>
</body>
</html>
