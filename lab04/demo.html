<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Testing</title>
</head>

<body>
  <h1>Form Lab Demo Section</h1>
  <form action="">
    <label for="fname">First Name: </label>
    <input type="text" name="fname" id="fname"><br><br>
    <label for="lname">Last Name: </label>
    <input type="text" name="lname" id="lname"><br><br>
    <label for="address">Address: </label>
    <input type="text" name="address" id="address" size="10" maxlength="20" placeholder="TCD">
    <br><br>
    <label for="pwd">Enter Password: </label>
    <input type="password" name="pwd" id="pwd">
    <br><br>
    <label for="online">Online</label>
    <input type="radio" name="delivery" id="online">
    <label for="inPerson">In Person</label>
    <input type="radio" name="delivery" id="inPerson">
    <label for="hybrid">Hybrid</label>
    <input type="radio" name="delivery" id="hybrid">
    <br><br>
    <label for="mod1">Authoring for Digital Media</label>
    <input type="checkbox" name="mod1" id="mod1">
    <label for="mod2">Contextual Media</label>
    <input type="checkbox" name="mod2" id="mod2">

    <input type="date" id="userDate">

    <br><br>
    <input type="submit" value="Click to Submit">
    <br>
    <input type="reset">

  </form>
</body>

</html>
