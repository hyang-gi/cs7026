<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="demo.css">
    <title>Selectors</title>
</head>
<body>
    <div id="container-one">
        <h1 class="extra">This is a heading within a container div 1</h1>

    </div>
