<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="layer.css">
    <title>Z-Index</title>
</head>

<body>
    <h1>CSS z-index</h1>
    <p>The box with the highest z-index appears on top.</p>

    <div class="container">
        <div class="box red">z-index: 1</div>
        <div class="box green">z-index: 2
            <div class="box yellow">child of green, z-index: 9000</div>
        </div>
        <div class="box blue">z-index: 3</div>
    </div>
</body>

</html>
