<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="float.css">
    <title>CSS Floats</title>
</head>

<body>
    <h1>CSS Float</h1>

    <div class="image-placeholder">Image</div>

    <p>
        This text wraps around the floated box. Using right or left, the text is placed adjacent to the image
        accordingly. The text wraps itself to the image container and continues in full width below it.
    </p>

    <p class="next-paragraph">
        This paragraph starts below the floated box.
    </p>
</body>

</html>
